specVersion: 1.0.0
description: >
  Keel positions on Aqua/SwapVM -- reconstructs live reservation price and
  inventory state from on-chain events, so a solver can route to a Keel
  position without re-deriving the Avellaneda-Stoikov math itself. See
  README.md's Subgraph section for the routability problem this answers.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    network: mainnet # TODO: set to the network Keel is actually deployed on
    source:
      address: "0x0000000000000000000000000000000000000000" # TODO: real Aqua deployment address
      abi: Aqua
      startBlock: 0 # TODO: block Aqua was deployed at on the target network
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - KeelPosition
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
        - name: KeelRouter
          file: ./abis/KeelRouter.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
      file: ./src/mapping.ts
  - kind: ethereum
    name: KeelRouter
    network: mainnet # TODO: must match the Aqua data source's network
    source:
      address: "0x0000000000000000000000000000000000000000" # TODO: real KeelRouter deployment address
      abi: KeelRouter
      startBlock: 0 # TODO: block KeelRouter was deployed at
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - KeelPosition
        - Fill
      abis:
        - name: KeelRouter
          file: ./abis/KeelRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/mapping.ts
