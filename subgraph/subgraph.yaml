specVersion: 1.0.0
description: >
  Keel positions on Aqua/SwapVM -- reconstructs live reservation price and
  inventory state from on-chain events, so a solver can route to a Keel
  position without re-deriving the Avellaneda-Stoikov math itself. See
  README.md's Subgraph section for the routability problem this answers.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    network: base-sepolia
    source:
      address: "0xAf5Bb8e83F3d22Ec349dB641E0Bd7edA5d9574CD"
      abi: Aqua
      startBlock: 46398488
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - KeelPosition
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
        - name: KeelRouter
          file: ./abis/KeelRouter.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
      file: ./src/mapping.ts
  # The original router, kept indexed: it still holds the original demo
  # position and every fill made against it. Dropping it would orphan that
  # history the moment the redeploy below started being indexed.
  - kind: ethereum
    name: KeelRouter
    network: base-sepolia
    source:
      address: "0x1771093A5094FCc818775806eD8a729f6cF7DA0E"
      abi: KeelRouter
      startBlock: 46398488
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - KeelPosition
        - Fill
      abis:
        - name: KeelRouter
          file: ./abis/KeelRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/mapping.ts
  # The current router. KeelRouter inlines KeelInstructions as an internal
  # library, so adding tokenIn/tokenOutDecimals normalization required a
  # redeploy to a new address rather than an upgrade -- everything shipped
  # since lives here, and was invisible to this subgraph until now.
  - kind: ethereum
    name: KeelRouterV2
    network: base-sepolia
    source:
      address: "0x9520b1F0Cbb14F0939041a16E12D9Bc857c50ea2"
      abi: KeelRouter
      startBlock: 46682344
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - KeelPosition
        - Fill
      abis:
        - name: KeelRouter
          file: ./abis/KeelRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/mapping.ts
